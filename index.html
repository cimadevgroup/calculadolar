<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadolar</title>
<meta name="description" content="Calculadora de tasas para Venezuela: BCV, paralelo y euro.">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Calculadolar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#000; --card:#141416; --card2:#1c1c1e; --field:#2c2c2e;
    --line:#2e2e32; --txt:#fff; --dim:#8e8e93; --dim2:#636366;
    --usd-bcv:#ff453a; --usd-par:#30d158; --eur:#0a84ff; --eur2:#64d2ff;
    --op:#ff9f0a; --warn:#ffd60a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--bg); color:var(--txt)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100dvh;
    padding:max(10px,env(safe-area-inset-top)) 10px calc(12px + env(safe-area-inset-bottom));
  }
  .app{max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:10px}

  header{display:flex; align-items:center; gap:10px}
  h1{font-size:22px; font-weight:800; color:var(--usd-bcv); margin:0; letter-spacing:-.4px}
  .ts{font-size:10px; color:var(--dim2); font-variant-numeric:tabular-nums; margin-left:auto; text-align:right; line-height:1.3}
  .icon-btn{
    width:34px; height:34px; flex:0 0 auto; border:none; border-radius:50%;
    background:var(--card2); color:var(--dim); display:grid; place-items:center; cursor:pointer;
  }
  .icon-btn:active{background:#3a3a3c; color:#fff}
  .icon-btn.spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:10px}

  .rates{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
  .rate{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:7px 8px; position:relative}
  .rate label{display:block; font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; margin-bottom:3px}
  .rate input{
    width:100%; min-width:0; background:transparent; border:none; outline:none; padding:0;
    font-size:19px; font-weight:700; text-align:center; font-variant-numeric:tabular-nums;
  }
  .rate .edited{position:absolute; top:6px; right:7px; font-size:8px; color:var(--dim2); display:none}
  .rate.is-edited .edited{display:block}
  .rate.is-edited{border-style:dashed}
  .r-usd-bcv label,.r-usd-bcv input{color:var(--usd-bcv)}
  .r-usd-bcv input::placeholder{color:#ff453a66}
  .r-usd-par label,.r-usd-par input{color:var(--usd-par)}
  .r-usd-par input::placeholder{color:#30d15866}
  .r-eur-bcv label,.r-eur-bcv input{color:var(--eur)}
  .r-eur-bcv input::placeholder{color:#0a84ff66}
  .r-eur-par label,.r-eur-par input{color:var(--eur2)}
  .r-eur-par input::placeholder{color:#64d2ff66}

  .cols{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
  .field-label{font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; color:var(--dim); margin:0 0 4px 2px}
  .field{display:flex; align-items:stretch; height:44px; background:var(--field); border:1px solid var(--line); border-radius:12px; overflow:hidden}
  .field:focus-within{border-color:#fff}
  .field input{
    flex:1; width:100%; min-width:0; background:transparent; border:none; outline:none; color:#fff;
    font-size:18px; text-align:center; font-variant-numeric:tabular-nums;
  }
  .field select{
    background:#3a3a3c; color:#fff; border:none; border-right:1px solid var(--line);
    font-size:13px; font-weight:700; padding:0 4px; outline:none;
  }
  .hint{margin-top:5px; font-size:10px; color:var(--dim2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; line-height:1.6; min-height:34px}
  .hint .row{display:flex; justify-content:space-between; gap:6px}
  .hint b{color:#d1d1d6; font-weight:700}
  .hint .empty{font-style:italic; color:var(--dim2)}

  .verdict{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:16px; border:1px dashed var(--line); background:var(--card)}
  .verdict .lbl{font-size:9.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--dim)}
  .verdict .val{font-size:27px; font-weight:800; line-height:1.05; font-variant-numeric:tabular-nums}
  .verdict .val small{font-size:11px; font-weight:500; color:var(--dim)}
  .verdict .tag{display:inline-block; margin-top:4px; font-size:9px; font-weight:800; text-transform:uppercase; padding:2px 7px; border-radius:6px; border:1px solid var(--line); color:var(--dim)}
  .verdict.ok{border-style:solid; border-color:#30d15866}
  .verdict.ok .tag{color:var(--usd-par); background:#30d1581f; border-color:#30d15866}
  .verdict.mid .tag{color:var(--warn); background:#ffd60a1f; border-color:#ffd60a66}
  .verdict.bad{border-style:solid; border-color:#ff453a66}
  .verdict.bad .tag{color:var(--usd-bcv); background:#ff453a1f; border-color:#ff453a66}

  .pad{background:var(--card2); border:1px solid var(--line); border-radius:18px; padding:10px}
  .expr{
    width:100%; background:var(--field); border:1px solid var(--line); border-radius:12px;
    color:#fff; font-size:20px; padding:9px 12px; outline:none; text-align:right;
    font-variant-numeric:tabular-nums; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .expr:focus{border-color:#fff}
  .expr::placeholder{font-family:-apple-system,sans-serif; font-size:12px; color:var(--dim2)}
  .res{height:32px; display:flex; align-items:center; justify-content:flex-end; gap:8px; padding:0 4px; font-size:24px; font-weight:300; font-variant-numeric:tabular-nums}
  .res .eq{font-size:13px; color:var(--dim2)}
  .res.err{color:var(--dim2); font-size:14px}
  .chips{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; margin-bottom:8px}
  .chip{
    border:1px solid; background:transparent; border-radius:10px; padding:7px 4px; cursor:pointer;
    font-size:11px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.25;
  }
  .chip span{display:block; font-size:8.5px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; opacity:.75}
  .chip:active{filter:brightness(1.6)}
  .c-usd-bcv{color:var(--usd-bcv); border-color:#ff453a55; background:#ff453a14}
  .c-usd-par{color:var(--usd-par); border-color:#30d15855; background:#30d15814}
  .c-eur-bcv{color:var(--eur); border-color:#0a84ff55; background:#0a84ff14}
  .c-eur-par{color:var(--eur2); border-color:#64d2ff55; background:#64d2ff14}
  .keys{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px}
  .key{
    height:42px; border:none; border-radius:12px; background:#3a3a3c; color:#fff;
    font-size:19px; font-weight:500; cursor:pointer;
  }
  .key:active{filter:brightness(1.4)}
  .key.op{background:var(--op)}
  .key.lite{background:#48484a; font-size:16px}
  .key.eq{background:var(--op); font-weight:700}
  .foot{text-align:center; font-size:9.5px; color:var(--dim2); padding:2px 0 4px}
  .foot a{color:var(--dim)}
  .toast{
    position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    background:#fff; color:#000; font-size:12px; font-weight:700; padding:8px 16px; border-radius:20px;
    opacity:0; pointer-events:none; transition:opacity .2s; z-index:9;
  }
  .toast.show{opacity:.95}
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>Calculadolar</h1>
    <button class="icon-btn" id="btnCopy" title="Copiar resumen" aria-label="Copiar resumen">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    </button>
    <button class="icon-btn" id="btnRefresh" title="Actualizar tasas" aria-label="Actualizar tasas">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
    </button>
    <div class="ts" id="stamp">…</div>
  </header>

  <section class="rates">
    <div class="rate r-usd-bcv" id="wrap-usdBcv">
      <label>Dólar BCV</label>
      <input id="usdBcv" type="text" inputmode="decimal" autocomplete="off" placeholder="—">
      <div class="edited">manual</div>
    </div>
    <div class="rate r-usd-par" id="wrap-usdPar">
      <label>Dólar paralelo</label>
      <input id="usdPar" type="text" inputmode="decimal" autocomplete="off" placeholder="—">
      <div class="edited">manual</div>
    </div>
    <div class="rate r-eur-bcv" id="wrap-eurBcv">
      <label>Euro BCV</label>
      <input id="eurBcv" type="text" inputmode="decimal" autocomplete="off" placeholder="—">
      <div class="edited">manual</div>
    </div>
    <div class="rate r-eur-par" id="wrap-eurPar">
      <label>Euro paralelo</label>
      <input id="eurPar" type="text" inputmode="decimal" autocomplete="off" placeholder="—">
      <div class="edited">manual</div>
    </div>
  </section>

  <section class="cols">
    <div>
      <p class="field-label">Precio en $</p>
      <div class="field"><input id="price" type="text" inputmode="decimal" autocomplete="off" placeholder="0"></div>
      <div class="hint" id="hintPrice"><div class="empty">Ingresa el precio…</div></div>
    </div>
    <div>
      <p class="field-label">Te cobran</p>
      <div class="field">
        <select id="cur"><option value="Bs">Bs</option><option value="$">$</option></select>
        <input id="pay" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
      </div>
      <div class="hint" id="hintPay"><div class="empty">Ingresa el monto…</div></div>
    </div>
  </section>

  <section class="verdict" id="verdict">
    <div>
      <div class="lbl">Tasa implícita</div>
      <div class="val" id="impRate">--,--<small> Bs/$</small></div>
    </div>
    <div style="margin-left:auto; text-align:right"><span class="tag" id="impTag">Esperando</span></div>
  </section>

  <section class="pad">
    <input class="expr" id="expr" type="text" inputmode="decimal" autocomplete="off" autocorrect="off"
           spellcheck="false" enterkeyhint="done" placeholder="Escribe con el teclado del teléfono y toca una tasa…">
    <div class="res" id="res"><span class="eq">=</span> 0</div>

    <div class="chips">
      <button class="chip c-usd-bcv" data-rate="usdBcv"><span>Dólar BCV</span><b id="chip-usdBcv">—</b></button>
      <button class="chip c-usd-par" data-rate="usdPar"><span>Dólar paralelo</span><b id="chip-usdPar">—</b></button>
      <button class="chip c-eur-bcv" data-rate="eurBcv"><span>Euro BCV</span><b id="chip-eurBcv">—</b></button>
      <button class="chip c-eur-par" data-rate="eurPar"><span>Euro paralelo</span><b id="chip-eurPar">—</b></button>
    </div>

    <div class="keys">
      <button class="key op" data-ins="+">+</button>
      <button class="key op" data-ins="-">−</button>
      <button class="key op" data-ins="*">×</button>
      <button class="key op" data-ins="/">÷</button>
      <button class="key lite" data-ins="(">(</button>
      <button class="key lite" id="kDel">⌫</button>
      <button class="key lite" id="kClear">C</button>
      <button class="key lite" data-ins=",">,</button>
      <button class="key lite" data-ins=")">)</button>
      <button class="key eq" id="kEq">=</button>
    </div>
  </section>

  <div class="foot">Tasas de <a href="https://ve.dolarapi.com" target="_blank" rel="noopener">ve.dolarapi.com</a> · referencial</div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  var API_USD = 'https://ve.dolarapi.com/v1/dolares';
  var API_EUR = 'https://ve.dolarapi.com/v1/euros';
  var CACHE_KEY = 'calculadolar.rates';
  var KEYS = ['usdBcv','usdPar','eurBcv','eurPar'];
  var LABEL = {usdBcv:'Dólar BCV', usdPar:'Dólar paralelo', eurBcv:'Euro BCV', eurPar:'Euro paralelo'};

  var api = {usdBcv:null, usdPar:null, eurBcv:null, eurPar:null, fetchedAt:null, stale:false};
  var $ = function(id){ return document.getElementById(id); };

  /* ---------- números ---------- */
  function ok(n){ return typeof n === 'number' && isFinite(n); }
  function num(str){
    if(str === null || str === undefined) return NaN;
    var s = String(str).trim().replace(/\s/g,'').replace(/,/g,'.');
    if(!s) return NaN;
    return parseFloat(s);
  }
  function fmt(n, d){
    if(!ok(n)) return '—';
    d = (d === undefined) ? 2 : d;
    return n.toLocaleString('es-VE', {minimumFractionDigits:d, maximumFractionDigits:d});
  }
  function plain(n){
    if(!ok(n)) return '';
    return String(parseFloat(n.toFixed(6))).replace('.', ',');
  }
  function rate(k){
    var manual = num($(k).value);
    if(ok(manual) && manual > 0) return manual;
    return api[k];
  }
  function isManual(k){
    var manual = num($(k).value);
    return ok(manual) && manual > 0;
  }

  /* ---------- evaluador de expresiones (sin eval) ---------- */
  function evaluate(src){
    var s = String(src).replace(/[×xX]/g,'*').replace(/[÷]/g,'/').replace(/[−–—]/g,'-').replace(/,/g,'.');
    var i = 0;
    function ws(){ while(i < s.length && s.charAt(i) === ' ') i++; }
    function unary(){
      ws();
      var c = s.charAt(i);
      if(c === '-'){ i++; return -unary(); }
      if(c === '+'){ i++; return unary(); }
      if(c === '('){
        i++;
        var v = sum();
        ws();
        if(s.charAt(i) !== ')') throw new Error('paréntesis');
        i++;
        return v;
      }
      var start = i;
      while(i < s.length && /[0-9.]/.test(s.charAt(i))) i++;
      if(i === start) throw new Error('número');
      var n = parseFloat(s.slice(start, i));
      if(!isFinite(n)) throw new Error('número');
      return n;
    }
    function prod(){
      var v = unary();
      for(;;){
        ws();
        var c = s.charAt(i);
        if(c === '*' || c === '/'){ i++; var r = unary(); v = (c === '*') ? v * r : v / r; }
        else return v;
      }
    }
    function sum(){
      var v = prod();
      for(;;){
        ws();
        var c = s.charAt(i);
        if(c === '+' || c === '-'){ i++; var r = prod(); v = (c === '+') ? v + r : v - r; }
        else return v;
      }
    }
    var out = sum();
    ws();
    if(i < s.length) throw new Error('sobra "' + s.slice(i) + '"');
    return out;
  }

  /* ---------- tasas ---------- */
  function paint(){
    KEYS.forEach(function(k){
      var v = api[k];
      $(k).placeholder = (v === null) ? '—' : fmt(v);
      $('chip-' + k).textContent = fmt(rate(k));
      $('wrap-' + k).classList.toggle('is-edited', isManual(k));
    });
    var st = $('stamp');
    if(api.fetchedAt){
      var d = new Date(api.fetchedAt);
      st.innerHTML = (api.stale ? 'Sin conexión<br>guardadas ' : 'Tasas de<br>') +
        d.toLocaleDateString('es-VE') + ' ' +
        d.toLocaleTimeString('es-VE', {hour:'2-digit', minute:'2-digit'});
    } else {
      st.textContent = 'Sin tasas';
    }
    compute();
  }

  function loadCache(){
    try{
      var raw = localStorage.getItem(CACHE_KEY);
      if(!raw) return;
      var c = JSON.parse(raw);
      KEYS.forEach(function(k){ if(typeof c[k] === 'number') api[k] = c[k]; });
      api.fetchedAt = c.fetchedAt || null;
      api.stale = true;
    }catch(e){}
  }
  function saveCache(){
    try{
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        usdBcv:api.usdBcv, usdPar:api.usdPar, eurBcv:api.eurBcv, eurPar:api.eurPar, fetchedAt:api.fetchedAt
      }));
    }catch(e){}
  }

  function pick(list, fuente){
    for(var i = 0; i < list.length; i++){
      if(list[i] && list[i].fuente === fuente){
        var v = list[i].promedio;
        if(v === null || v === undefined) v = list[i].venta;
        if(typeof v === 'number' && v > 0) return v;
      }
    }
    return null;
  }

  function fetchRates(){
    var btn = $('btnRefresh');
    btn.classList.add('spin');
    KEYS.forEach(function(k){ $(k).value = ''; });
    return Promise.all([
      fetch(API_USD, {cache:'no-store'}).then(function(r){ return r.json(); }),
      fetch(API_EUR, {cache:'no-store'}).then(function(r){ return r.json(); })
    ]).then(function(res){
      var usd = res[0], eur = res[1];
      api.usdBcv = pick(usd, 'oficial');
      api.usdPar = pick(usd, 'paralelo');
      api.eurBcv = pick(eur, 'oficial');
      api.eurPar = pick(eur, 'paralelo');
      api.fetchedAt = Date.now();
      api.stale = false;
      saveCache();
      paint();
    }).catch(function(){
      toast('No se pudieron bajar las tasas');
      paint();
    }).then(function(){
      btn.classList.remove('spin');
    });
  }

  /* ---------- comparador ---------- */
  function compute(){
    var bcv = rate('usdBcv'), par = rate('usdPar');
    var price = num($('price').value);
    var pay = num($('pay').value);
    var cur = $('cur').value;

    var conv = function(n, r, mul){ return ok(r) && r > 0 ? fmt(mul ? n * r : n / r) : '—'; };

    var hp = $('hintPrice');
    if(price > 0){
      hp.innerHTML =
        '<div class="row"><span>BCV</span><b>Bs ' + conv(price, bcv, 1) + '</b></div>' +
        '<div class="row"><span>Paralelo</span><b>Bs ' + conv(price, par, 1) + '</b></div>';
    } else {
      hp.innerHTML = '<div class="empty">Ingresa el precio…</div>';
    }

    var hq = $('hintPay');
    if(pay > 0){
      if(cur === 'Bs'){
        hq.innerHTML =
          '<div class="row"><span>Si fuera BCV</span><b>$ ' + conv(pay, bcv, 0) + '</b></div>' +
          '<div class="row"><span>Si fuera paralelo</span><b>$ ' + conv(pay, par, 0) + '</b></div>';
      } else {
        hq.innerHTML =
          '<div class="row"><span>A tasa BCV</span><b>Bs ' + conv(pay, bcv, 1) + '</b></div>' +
          '<div class="row"><span>A tasa paralelo</span><b>Bs ' + conv(pay, par, 1) + '</b></div>';
      }
    } else {
      hq.innerHTML = '<div class="empty">Ingresa el monto…</div>';
    }

    var box = $('verdict');
    box.classList.remove('ok','mid','bad');
    if(price > 0 && pay > 0 && ok(bcv) && ok(par)){
      var imp = (cur === 'Bs') ? (pay / price) : ((pay / price) * bcv);
      $('impRate').innerHTML = fmt(imp) + '<small> Bs/$</small>';
      if(imp <= bcv * 1.01){ box.classList.add('ok'); $('impTag').textContent = 'Excelente · oficial'; }
      else if(imp >= par * 0.99){ box.classList.add('bad'); $('impTag').textContent = 'Alerta · paralelo'; }
      else { box.classList.add('mid'); $('impTag').textContent = 'Tasa mixta / inflada'; }
      box.dataset.imp = imp;
    } else {
      $('impRate').innerHTML = '--,--<small> Bs/$</small>';
      $('impTag').textContent = 'Esperando';
      box.dataset.imp = '';
    }
  }

  /* ---------- calculadora ---------- */
  function showResult(){
    var box = $('res');
    var raw = $('expr').value.trim();
    if(!raw){ box.className = 'res'; box.innerHTML = '<span class="eq">=</span> 0'; return; }
    try{
      var v = evaluate(raw);
      if(!ok(v)) throw new Error('∞');
      box.className = 'res';
      box.innerHTML = '<span class="eq">=</span> ' + fmt(v, (Math.abs(v % 1) > 1e-9) ? 2 : 0);
      box.dataset.value = v;
    }catch(e){
      box.className = 'res err';
      box.textContent = '…';
      box.dataset.value = '';
    }
  }

  function insert(text){
    var el = $('expr');
    var start = (el.selectionStart === null) ? el.value.length : el.selectionStart;
    var end = (el.selectionEnd === null) ? el.value.length : el.selectionEnd;
    el.value = el.value.slice(0, start) + text + el.value.slice(end);
    var pos = start + text.length;
    try{ el.setSelectionRange(pos, pos); }catch(e){}
    showResult();
  }

  function backspace(){
    var el = $('expr');
    var start = el.selectionStart, end = el.selectionEnd;
    if(start === end){
      if(start === 0) return;
      el.value = el.value.slice(0, start - 1) + el.value.slice(end);
      try{ el.setSelectionRange(start - 1, start - 1); }catch(e){}
    } else {
      el.value = el.value.slice(0, start) + el.value.slice(end);
      try{ el.setSelectionRange(start, start); }catch(e){}
    }
    showResult();
  }

  function toast(msg){
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ t.classList.remove('show'); }, 1600);
  }

  /* ---------- eventos ---------- */
  KEYS.forEach(function(k){
    $(k).addEventListener('input', paint);
  });
  ['price','pay'].forEach(function(id){ $(id).addEventListener('input', compute); });
  $('cur').addEventListener('change', compute);
  $('btnRefresh').addEventListener('click', fetchRates);
  $('expr').addEventListener('input', showResult);

  // Los botones no roban el foco: el teclado del teléfono sigue abierto.
  document.querySelectorAll('.pad button').forEach(function(b){
    b.addEventListener('mousedown', function(e){ e.preventDefault(); });
    b.addEventListener('touchstart', function(e){ e.preventDefault(); }, {passive:false});
  });

  document.querySelectorAll('.chip').forEach(function(b){
    b.addEventListener('click', function(){
      var k = b.dataset.rate;
      var v = rate(k);
      if(!ok(v)){ toast('Sin tasa de ' + LABEL[k]); return; }
      var cur = $('expr').value;
      var before = cur.slice(0, $('expr').selectionStart === null ? cur.length : $('expr').selectionStart);
      // si viene pegado a un número, mete el × solo
      if(/[0-9.,)]\s*$/.test(before)) insert('*' + plain(v));
      else insert(plain(v));
      $('expr').focus();
    });
  });

  document.querySelectorAll('.key[data-ins]').forEach(function(b){
    b.addEventListener('click', function(){ insert(b.dataset.ins); $('expr').focus(); });
  });
  $('kDel').addEventListener('click', function(){ backspace(); $('expr').focus(); });
  $('kClear').addEventListener('click', function(){
    $('expr').value = '';
    showResult();
    $('expr').focus();
  });
  function equals(){
    var v = parseFloat($('res').dataset.value);
    if(!ok(v)) return;
    $('expr').value = plain(v);
    showResult();
    $('expr').focus();
  }
  $('kEq').addEventListener('click', function(){
    equals();
  });

  $('expr').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); equals(); }
  });

  $('btnCopy').addEventListener('click', function(){
    var lines = [];
    lines.push('Calculadolar · ' + new Date().toLocaleString('es-VE'));
    KEYS.forEach(function(k){
      if(ok(rate(k))) lines.push(LABEL[k] + ': ' + fmt(rate(k)) + ' Bs' + (isManual(k) ? ' (manual)' : ''));
    });
    var price = num($('price').value), pay = num($('pay').value);
    if(price > 0) lines.push('Precio: $ ' + fmt(price) + ' = Bs ' + fmt(price * rate('usdBcv')) + ' BCV / Bs ' + fmt(price * rate('usdPar')) + ' paralelo');
    if(pay > 0) lines.push('Te cobran: ' + $('cur').value + ' ' + fmt(pay));
    var imp = parseFloat($('verdict').dataset.imp);
    if(ok(imp)) lines.push('Tasa implícita: ' + fmt(imp) + ' Bs/$ — ' + $('impTag').textContent);
    var expr = $('expr').value.trim();
    if(expr && $('res').dataset.value) lines.push('Cálculo: ' + expr + ' = ' + fmt(parseFloat($('res').dataset.value)));
    var text = lines.join('\n');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast('Copiado'); }, function(){ toast('No se pudo copiar'); });
    } else {
      toast('No se pudo copiar');
    }
  });

  /* ---------- arranque ---------- */
  loadCache();
  try{ paint(); }catch(e){ console.error(e); }
  showResult();
  fetchRates();

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
