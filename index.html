<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Calculadolar</title>
<meta name="description" content="Calculadora de tasas para Venezuela: BCV, paralelo, Binance, Bybit y euro.">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Calculadolar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#000; --card:#141416; --card2:#1c1c1e; --field:#2c2c2e;
    --line:#2e2e32; --txt:#fff; --dim:#8e8e93; --dim2:#636366;
    --bcv:#ff453a; --par:#30d158; --bin:#ffd60a; --byb:#5ac8fa;
    --eur:#0a84ff; --zel:#bf5af2; --ppl:#7d8cff; --prom:#c7c7cc;
    --op:#ff9f0a; --warn:#ffd60a; --glow:#ffc466;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{
    margin:0; background:var(--bg); color:var(--txt);
    overscroll-behavior:none; touch-action:pan-y;
    -webkit-text-size-adjust:100%; text-size-adjust:100%;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:max(8px,env(safe-area-inset-top)) 10px calc(14px + env(safe-area-inset-bottom));
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    overflow-x:hidden;
  }
  input{-webkit-user-select:text; user-select:text}
  .app{max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:8px}

  header{display:flex; align-items:center; gap:8px}
  h1{font-size:20px; font-weight:800; color:var(--bcv); margin:0; letter-spacing:-.4px}
  .ts{font-size:9px; color:var(--dim2); font-variant-numeric:tabular-nums; margin-left:auto; text-align:right; line-height:1.35}
  .icon-btn{width:32px; height:32px; flex:0 0 auto; border:none; border-radius:50%; background:var(--card2); color:var(--dim); display:grid; place-items:center; cursor:pointer}
  .icon-btn:active{background:#3a3a3c; color:#fff}
  .icon-btn.spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .blk{transition:opacity .18s ease}
  .blk.dim{opacity:.28}
  .lit-ring{
    border-color:rgba(255,196,102,.7) !important;
    box-shadow:0 0 0 1px rgba(255,196,102,.6), 0 0 14px rgba(255,176,60,.55), 0 0 34px rgba(255,159,10,.28);
  }

  /* ---- tasas: 2 filas de 4, nada se desborda ---- */
  .rates{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:5px}
  .rate{
    background:var(--card); border:1px solid var(--line); border-radius:11px;
    padding:4px 2px 5px; text-align:center; position:relative; overflow:hidden; min-width:0;
  }
  .rate label{display:block; font-size:7.5px; font-weight:800; text-transform:uppercase; letter-spacing:.2px; line-height:1.15; margin-bottom:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .rate input{
    width:100%; min-width:0; background:transparent; border:none; outline:none; padding:0;
    font-size:13px; font-weight:700; text-align:center; font-variant-numeric:tabular-nums;
    letter-spacing:-.3px; caret-color:var(--glow);
  }
  .rate.is-edited{border-style:dashed}
  .rate.is-edited::after{content:"✎"; position:absolute; top:1px; right:3px; font-size:7px; color:var(--dim)}
  .r-bcv label,.r-bcv input{color:var(--bcv)} .r-bcv input::placeholder{color:#ff453a66}
  .r-par label,.r-par input{color:var(--par)} .r-par input::placeholder{color:#30d15866}
  .r-bin label,.r-bin input{color:var(--bin)} .r-bin input::placeholder{color:#ffd60a66}
  .r-byb label,.r-byb input{color:var(--byb)} .r-byb input::placeholder{color:#5ac8fa66}
  .r-eur label,.r-eur input{color:var(--eur)} .r-eur input::placeholder{color:#0a84ff66}
  .r-zel label,.r-zel input{color:var(--zel)} .r-zel input::placeholder{color:#bf5af266}
  .r-ppl label,.r-ppl input{color:var(--ppl)} .r-ppl input::placeholder{color:#7d8cff66}
  .r-prom label,.r-prom input{color:var(--prom)} .r-prom input::placeholder{color:#c7c7cc66}
  .r-eur{border-color:#0a84ff44}

  /* ---- entradas ---- */
  .cols{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
  .field-label{font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.3px; color:var(--dim); margin:0 0 4px 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .field{display:flex; align-items:stretch; height:44px; background:var(--field); border:1px solid var(--line); border-radius:12px; overflow:hidden; transition:box-shadow .18s ease; min-width:0}
  .field input{flex:1; width:100%; min-width:0; background:transparent; border:none; outline:none; color:#fff; font-size:17px; text-align:center; font-variant-numeric:tabular-nums; letter-spacing:-.3px; caret-color:var(--glow)}
  .field .sep{width:1px; background:var(--line); margin:7px 0}
  .field .disc{flex:0 0 40px; width:40px; font-size:14px; color:var(--warn); text-align:right; padding-right:2px}
  .field .disc::placeholder{color:#ffd60a55}
  .field .pct{display:flex; align-items:center; padding:0 5px 0 2px; font-size:9px; font-weight:800; color:var(--warn)}
  .cur-btn{
    flex:0 0 50px; background:#3a3a3c; color:#fff; border:none; border-right:1px solid var(--line);
    cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center;
    line-height:1.05; gap:1px; padding:0 2px;
  }
  .cur-btn small{font-size:6.5px; font-weight:700; color:var(--dim); letter-spacing:.2px; text-transform:uppercase}
  .cur-btn b{font-size:15px; font-weight:800}
  .cur-btn:active{background:#4a4a4e}

  .hint{
    margin-top:5px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 5px;
    font-size:9px; color:var(--dim2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    line-height:1.6; min-height:60px;
  }
  .hint .row{display:flex; gap:3px; align-items:baseline; min-width:0}
  .hint .row span{flex:0 0 auto; opacity:.7}
  .hint .row b{flex:1; min-width:0; font-weight:700; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .hint .row.wide{grid-column:1 / -1}
  .hint .row.net span,.hint .row.net b{color:var(--warn)}
  .hint .k-bcv span,.hint .k-bcv b{color:var(--bcv)}
  .hint .k-par span,.hint .k-par b{color:var(--par)}
  .hint .k-bin span,.hint .k-bin b{color:var(--bin)}
  .hint .k-byb span,.hint .k-byb b{color:var(--byb)}
  .hint .k-eur span,.hint .k-eur b{color:var(--eur)}
  .hint .k-zel span,.hint .k-zel b{color:var(--zel)}
  .hint .k-ppl span,.hint .k-ppl b{color:var(--ppl)}
  .hint .k-prom span,.hint .k-prom b{color:var(--prom)}
  .hint .empty{grid-column:1 / -1; font-style:italic}

  /* ---- veredicto ---- */
  .verdict{padding:9px 11px; border-radius:16px; border:1px dashed var(--line); background:var(--card); overflow:hidden}
  .vtop{display:flex; align-items:center; gap:8px; min-width:0}
  .verdict .lbl{font-size:9px; text-transform:uppercase; letter-spacing:.5px; color:var(--dim)}
  .verdict .val{font-size:25px; font-weight:800; line-height:1.1; font-variant-numeric:tabular-nums; letter-spacing:-.5px; white-space:nowrap}
  .verdict .val small{font-size:11px; font-weight:500; color:var(--dim)}
  .verdict .tag{font-size:9px; font-weight:800; text-transform:uppercase; padding:4px 7px; border-radius:7px; border:1px solid var(--line); color:var(--dim); margin-left:auto; text-align:center; max-width:48%; line-height:1.25}
  .verdict .extra{margin-top:6px; font-size:9.5px; color:var(--dim2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; line-height:1.5}
  .verdict .extra b{color:#d1d1d6}
  .verdict .extra .up{color:var(--bcv)} .verdict .extra .down{color:var(--par)}
  .verdict.ok{border-style:solid; border-color:#30d15866}
  .verdict.ok .tag{color:var(--par); background:#30d1581f; border-color:#30d15866}
  .verdict.mid .tag{color:var(--warn); background:#ffd60a1f; border-color:#ffd60a66}
  .verdict.bad{border-style:solid; border-color:#ff453a66}
  .verdict.bad .tag{color:var(--bcv); background:#ff453a1f; border-color:#ff453a66}
  .verdict.eur{border-style:solid; border-color:#0a84ff88}
  .verdict.eur .tag{color:var(--eur); background:#0a84ff26; border-color:#0a84ff88}

  /* ---- la conclusión: cómo te conviene pagar ---- */
  .advice{display:none; margin-top:8px; border-radius:12px; padding:7px 9px; border:1px solid var(--line); background:#0d0d0f}
  .advice.on{display:block}
  .advice .head{display:flex; align-items:baseline; gap:6px; flex-wrap:wrap}
  .advice .big{font-size:14px; font-weight:800; letter-spacing:-.2px}
  .advice .save{font-size:11px; font-weight:700; font-variant-numeric:tabular-nums}
  .advice .why{margin-top:3px; font-size:9px; color:var(--dim2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; line-height:1.5}
  .advice.bs{border-color:#30d15877; background:#30d1580f}
  .advice.bs .big,.advice.bs .save{color:var(--par)}
  .advice.usd{border-color:#ffd60a77; background:#ffd60a0f}
  .advice.usd .big,.advice.usd .save{color:var(--warn)}
  .advice.tie{border-color:var(--line)}
  .advice.tie .big{color:var(--dim)}

  /* ---- teclado ---- */
  .pad{background:var(--card2); border:1px solid var(--line); border-radius:18px; padding:9px; transition:box-shadow .18s ease}
  .disp{display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line); padding-bottom:5px; transition:opacity .18s ease; min-width:0}
  .disp.off{opacity:.4}
  .unit-btn{
    flex:0 0 auto; background:#3a3a3c; color:#fff; border:1px solid var(--line); border-radius:9px;
    padding:4px 9px; font-size:13px; font-weight:800; cursor:pointer; line-height:1.15; text-align:center;
  }
  .unit-btn small{display:block; font-size:6.5px; font-weight:700; color:var(--dim); letter-spacing:.2px; text-transform:uppercase}
  .unit-btn:active{background:#4a4a4e}
  .expr{
    flex:1; min-width:0; background:transparent; border:none; color:#fff; font-size:15px;
    padding:2px 2px 4px; outline:none; text-align:right; caret-color:var(--glow);
    font-variant-numeric:tabular-nums; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .expr::placeholder{font-family:-apple-system,sans-serif; font-size:11px; color:var(--dim2)}
  .resline{display:flex; align-items:flex-end; gap:8px; min-width:0}
  .resline .who{font-size:8.5px; font-weight:800; text-transform:uppercase; letter-spacing:.3px; color:var(--glow); white-space:nowrap; padding-bottom:9px; overflow:hidden; text-overflow:ellipsis; max-width:45%}
  .resline .who.idle{color:var(--dim2)}
  .res{flex:1; min-width:0; min-height:38px; display:flex; align-items:center; justify-content:flex-end; padding:2px 4px; font-size:30px; font-weight:300; font-variant-numeric:tabular-nums; letter-spacing:-1px; overflow:hidden; white-space:nowrap}
  .res.err{color:var(--dim2); font-size:15px}
  .res u{font-size:13px; color:var(--dim); text-decoration:none; margin-right:5px; font-weight:600; letter-spacing:0}
  .keyzone{border:1px solid transparent; border-radius:15px; padding:6px 5px 5px; margin:0 -5px -5px; transition:box-shadow .18s ease}
  .keyzone.only-num .sendto,
  .keyzone.only-num .chip,
  .keyzone.only-num .key.op,
  .keyzone.only-num .key.fn:not(.keep){opacity:.22; pointer-events:none}
  .sendto,.chip,.key{transition:opacity .18s ease}
  .sendto{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; margin-bottom:7px}
  .sendto button{border:1px solid var(--line); background:#2c2c2e; color:var(--dim); border-radius:9px; padding:6px 2px; font-size:9.5px; font-weight:700; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .sendto button:active{background:#3a3a3c; color:#fff}
  .chips{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:5px; margin-bottom:7px}
  .chip{border:1px solid; background:transparent; border-radius:10px; padding:4px 1px; cursor:pointer; line-height:1.2; overflow:hidden; min-width:0}
  .chip .main{display:block; font-size:9.5px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .chip .rt{display:block; font-size:8px; font-weight:600; opacity:.8; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .chip:active{filter:brightness(1.7)}
  .c-bcv{color:var(--bcv); border-color:#ff453a55; background:#ff453a14}
  .c-par{color:var(--par); border-color:#30d15855; background:#30d15814}
  .c-bin{color:var(--bin); border-color:#ffd60a55; background:#ffd60a14}
  .c-byb{color:var(--byb); border-color:#5ac8fa55; background:#5ac8fa14}
  .c-eur{color:var(--eur); border-color:#0a84ff55; background:#0a84ff14}
  .c-zel{color:var(--zel); border-color:#bf5af255; background:#bf5af214}
  .c-ppl{color:var(--ppl); border-color:#7d8cff55; background:#7d8cff14}
  .c-prom{color:var(--prom); border-color:#c7c7cc55; background:#c7c7cc14}
  .keys{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px}
  .key{height:44px; border:none; border-radius:12px; background:#3a3a3c; color:#fff; font-size:20px; font-weight:500; cursor:pointer; font-variant-numeric:tabular-nums}
  .key:active{filter:brightness(1.5)}
  .key.num{background:#48484a}
  .key.op{background:var(--op); font-weight:600}
  .key.fn{background:#5a5a5e; font-size:16px}
  .key.ac{background:#a5a5a5; color:#000; font-weight:700; font-size:16px}

  .toast{position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#fff; color:#000; font-size:12px; font-weight:700; padding:8px 16px; border-radius:20px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:9; max-width:90vw; text-align:center}
  .toast.show{opacity:.95}
</style>
</head>
<body>
<div class="app">

  <header class="blk" id="blk-head">
    <h1>Calculadolar</h1>
    <button class="icon-btn" id="btnShot" title="Guardar recibo" aria-label="Guardar recibo">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    </button>
    <button class="icon-btn" id="btnCopy" title="Copiar resumen" aria-label="Copiar resumen">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    </button>
    <button class="icon-btn" id="btnRefresh" title="Actualizar tasas" aria-label="Actualizar tasas">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
    </button>
    <div class="ts" id="stamp">…</div>
  </header>

  <section class="rates" id="rates"></section>

  <section class="cols">
    <div class="blk" id="blk-price">
      <p class="field-label">Precio pagando en $</p>
      <div class="field" id="fld-price">
        <input id="price" type="text" inputmode="none" autocomplete="off" placeholder="0" aria-label="Precio pagando en dólares">
        <div class="sep"></div>
        <input id="disc" class="disc" type="text" inputmode="none" autocomplete="off" placeholder="0" aria-label="Descuento por ciento">
        <div class="pct">% desc</div>
      </div>
      <div class="hint" id="hintPrice"><div class="empty">Ingresa el precio…</div></div>
    </div>
    <div class="blk" id="blk-pay">
      <p class="field-label">Precio pagando en Bs</p>
      <div class="field" id="fld-pay">
        <button class="cur-btn" id="cur" type="button" data-cur="Bs" aria-label="Mostrar ese precio en bolívares o en dólares">
          <small>mostrar en</small><b id="curTxt">Bs</b>
        </button>
        <input id="pay" type="text" inputmode="none" autocomplete="off" placeholder="0" aria-label="Precio pagando en bolívares">
      </div>
      <div class="hint" id="hintPay"><div class="empty">Ingresa el monto…</div></div>
    </div>
  </section>

  <section class="verdict blk" id="verdict">
    <div class="vtop">
      <div>
        <div class="lbl">Tasa implícita</div>
        <div class="val" id="impRate">--,--<small> Bs/$</small></div>
      </div>
      <div class="tag" id="impTag">Esperando</div>
    </div>
    <div class="extra" id="impExtra"></div>
    <div class="advice" id="advice">
      <div class="head"><span class="big" id="adviceBig"></span><span class="save" id="adviceSave"></span></div>
      <div class="why" id="adviceWhy"></div>
    </div>
  </section>

  <section class="pad" id="pad">
    <div class="disp" id="disp">
      <button class="unit-btn" id="calcCur" type="button" data-cur="Bs" aria-label="Unidad del cálculo">
        <small>unidad</small><span id="calcCurTxt">Bs</span>
      </button>
      <input class="expr" id="expr" type="text" inputmode="none" autocomplete="off" autocorrect="off"
             spellcheck="false" placeholder="0">
    </div>
    <div class="resline">
      <div class="who idle" id="resFor">Cálculo libre</div>
      <div class="res" id="res">0</div>
    </div>

    <div class="keyzone" id="keyzone">
      <div class="sendto">
        <button id="toPrice" type="button">↑ Al precio en $</button>
        <button id="toPay" type="button">↑ A pagando en Bs</button>
      </div>

      <div class="chips" id="chips"></div>

      <div class="keys">
        <button class="key ac" id="kClear" type="button">AC</button>
        <button class="key fn" data-ins="(" type="button">(</button>
        <button class="key fn" data-ins=")" type="button">)</button>
        <button class="key op" data-ins="/" type="button">÷</button>

        <button class="key num" data-ins="7" type="button">7</button>
        <button class="key num" data-ins="8" type="button">8</button>
        <button class="key num" data-ins="9" type="button">9</button>
        <button class="key op" data-ins="*" type="button">×</button>

        <button class="key num" data-ins="4" type="button">4</button>
        <button class="key num" data-ins="5" type="button">5</button>
        <button class="key num" data-ins="6" type="button">6</button>
        <button class="key op" data-ins="-" type="button">−</button>

        <button class="key num" data-ins="1" type="button">1</button>
        <button class="key num" data-ins="2" type="button">2</button>
        <button class="key num" data-ins="3" type="button">3</button>
        <button class="key op" data-ins="+" type="button">+</button>

        <button class="key num" data-ins="0" type="button">0</button>
        <button class="key num" id="kDec" data-ins="," type="button">,</button>
        <button class="key fn keep" id="kDel" type="button">⌫</button>
        <button class="key op" id="kEq" type="button">=</button>
      </div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  var API_USD = 'https://ve.dolarapi.com/v1/dolares';
  var API_EUR = 'https://ve.dolarapi.com/v1/euros';
  var API_P2P = 'https://criptoya.com/api/usdt/ves/1';
  var CACHE_KEY = 'calculadolar.rates';
  var MANUAL_KEY = 'calculadolar.manual';

  /* las ocho tasas */
  var KEYS   = ['bcv','par','bin','byb','eur','zel','ppl','prom'];
  var AUTO   = ['bcv','par','bin','byb','eur'];   // bajan solas
  var MANUAL = ['zel','ppl'];                     // solo a mano, se quedan guardadas
  var MARKET = ['par','bin','byb','zel','ppl'];   // a estas puedes vender tu dólar
  var LABEL = {bcv:'BCV', par:'Paralelo', bin:'Binance', byb:'Bybit', eur:'Euro BCV', zel:'Zelle', ppl:'PayPal', prom:'Promedio'};
  var TAB   = {bcv:'BCV', par:'PARALELO', bin:'BINANCE', byb:'BYBIT', eur:'EURO BCV', zel:'ZELLE ✎', ppl:'PAYPAL ✎', prom:'PROMEDIO'};
  var SHORT = {bcv:'BCV', par:'PAR', bin:'BIN', byb:'BYB', eur:'EUR', zel:'ZEL', ppl:'PPL', prom:'PRO'};
  var CHIP  = {bcv:'a $ BCV', par:'a $ Paral.', bin:'a $ Binance', byb:'a $ Bybit', eur:'a € BCV', zel:'a $ Zelle', ppl:'a $ PayPal', prom:'a $ Prom.'};

  var api = {fetchedAt:null, stale:false};
  KEYS.forEach(function(k){ api[k] = null; });
  var active = null;
  var $ = function(id){ return document.getElementById(id); };
  function curr(){ return $('cur').dataset.cur; }
  function calcCur(){ return $('calcCur').dataset.cur; }

  /* ---------- números ---------- */
  function ok(n){ return typeof n === 'number' && isFinite(n); }
  function num(str){
    if(str === null || str === undefined) return NaN;
    var s = String(str).trim();
    if(!s) return NaN;
    try{ return evaluate(s); }catch(e){ return NaN; }
  }
  function fmt(n, d){
    if(!ok(n)) return '—';
    d = (d === undefined) ? 2 : d;
    return n.toLocaleString('es-VE', {minimumFractionDigits:d, maximumFractionDigits:d});
  }
  function fmtU(n, unit, d){
    if(!ok(n)) return '—';
    d = (d === undefined) ? 2 : d;
    return n.toLocaleString(unit === '$' ? 'en-US' : 'es-VE', {minimumFractionDigits:d, maximumFractionDigits:d});
  }
  /* en los desgloses, de diez mil para arriba los céntimos sobran y no caben */
  function fmtS(n){ return ok(n) ? fmt(n, Math.abs(n) >= 10000 ? 0 : 2) : '—'; }
  function pct(n){
    if(!ok(n)) return '—';
    if(Math.abs(n) < 0.05) return '0 %';
    return (n > 0 ? '+' : '−') + fmt(Math.abs(n), 1) + ' %';
  }
  function plain(n, sep){
    if(!ok(n)) return '';
    return String(parseFloat(n.toFixed(6))).replace('.', sep || ',');
  }

  function typed(k){
    var v = num($(k).value);
    return (ok(v) && v > 0) ? v : NaN;
  }
  function isManual(k){ return ok(typed(k)); }
  function rate(k){
    var t = typed(k);
    if(ok(t)) return t;
    if(k === 'prom'){
      var sum = 0, n = 0;
      MARKET.forEach(function(m){ var v = rate(m); if(ok(v) && v > 0){ sum += v; n++; } });
      return n ? sum / n : null;
    }
    return api[k];
  }

  /* ---------- evaluador (sin eval) ---------- */
  function evaluate(src){
    var s = String(src).replace(/[×xX]/g,'*').replace(/[÷]/g,'/').replace(/[−–—]/g,'-').replace(/,/g,'.');
    var i = 0;
    function ws(){ while(i < s.length && s.charAt(i) === ' ') i++; }
    function unary(){
      ws();
      var c = s.charAt(i);
      if(c === '-'){ i++; return -unary(); }
      if(c === '+'){ i++; return unary(); }
      if(c === '('){
        i++;
        var v = sum();
        ws();
        if(s.charAt(i) !== ')') throw new Error('paréntesis');
        i++;
        return v;
      }
      var start = i;
      while(i < s.length && /[0-9.]/.test(s.charAt(i))) i++;
      if(i === start) throw new Error('número');
      var n = parseFloat(s.slice(start, i));
      if(!ok(n)) throw new Error('número');
      return n;
    }
    function prod(){
      var v = unary();
      for(;;){
        ws();
        var c = s.charAt(i);
        if(c === '*' || c === '/'){ i++; var r = unary(); v = (c === '*') ? v * r : v / r; }
        else return v;
      }
    }
    function sum(){
      var v = prod();
      for(;;){
        ws();
        var c = s.charAt(i);
        if(c === '+' || c === '-'){ i++; var r = prod(); v = (c === '+') ? v + r : v - r; }
        else return v;
      }
    }
    var out = sum();
    ws();
    if(i < s.length) throw new Error('sobra');
    return out;
  }

  /* ---------- se arma la fila de tasas y los botones ---------- */
  function build(){
    var rows = KEYS.map(function(k){
      return '<div class="rate r-' + k + ' blk" id="wrap-' + k + '">' +
               '<label for="' + k + '">' + TAB[k] + '</label>' +
               '<input id="' + k + '" type="text" inputmode="none" autocomplete="off" placeholder="—" aria-label="Tasa ' + LABEL[k] + '">' +
             '</div>';
    }).join('');
    $('rates').innerHTML = rows;
    $('chips').innerHTML = KEYS.map(function(k){
      return '<button class="chip c-' + k + '" data-rate="' + k + '" type="button">' +
               '<span class="main">' + CHIP[k] + '</span>' +
               '<span class="rt" id="chip-' + k + '">—</span>' +
             '</button>';
    }).join('');
  }

  /* ---------- foco ---------- */
  var FIELDS = KEYS.concat(['price','disc','pay','expr']);
  function fieldName(el){
    if(!el) return 'Cálculo libre';
    if(el.id === 'pay') return 'Pagando en Bs';
    if(el.id === 'price') return 'Precio en $';
    if(el.id === 'disc') return 'Descuento %';
    if(el.id === 'expr') return 'Cálculo libre';
    return 'Tasa ' + LABEL[el.id];
  }
  function decFor(el){
    if(el && el.id === 'price') return '.';
    if(el && el.id === 'pay') return (curr() === '$') ? '.' : ',';
    if(!el || el.id === 'expr') return (calcCur() === '$') ? '.' : ',';
    return ',';
  }
  function target(){ return active || $('expr'); }

  function setActive(el){
    active = el || null;
    document.querySelectorAll('.blk').forEach(function(b){
      b.classList.toggle('dim', !!active && !b.contains(active));
    });
    $('fld-price').classList.toggle('lit-ring', !!active && (active.id === 'price' || active.id === 'disc'));
    $('fld-pay').classList.toggle('lit-ring', !!active && active.id === 'pay');
    KEYS.forEach(function(k){
      $('wrap-' + k).classList.toggle('lit-ring', !!active && active.id === k);
    });
    var onCalc = !!active && active.id === 'expr';
    $('pad').classList.toggle('lit-ring', onCalc);
    $('keyzone').classList.toggle('lit-ring', !!active && !onCalc);
    $('keyzone').classList.toggle('only-num', !!active && !onCalc);
    $('disp').classList.toggle('off', !!active && !onCalc);
    var who = $('resFor');
    who.textContent = fieldName(active);
    who.classList.toggle('idle', !active);
    var dk = $('kDec');
    dk.dataset.ins = decFor(active);
    dk.textContent = dk.dataset.ins;
    showResult();
  }

  /* ---------- pintar ---------- */
  function paint(){
    KEYS.forEach(function(k){
      var auto = (k === 'prom') ? (isManual(k) ? null : rate(k)) : api[k];
      $(k).placeholder = ok(auto) ? fmt(auto) : (MANUAL.indexOf(k) >= 0 ? 'a mano' : '—');
      $('chip-' + k).textContent = ok(rate(k)) ? '(' + fmt(rate(k)) + ')' : '—';
      $('wrap-' + k).classList.toggle('is-edited', isManual(k) && MANUAL.indexOf(k) < 0);
    });
    var st = $('stamp');
    if(api.fetchedAt){
      var d = new Date(api.fetchedAt);
      st.innerHTML = (api.stale ? 'Sin conexión · guardadas<br>' : 'Tasas de<br>') +
        d.toLocaleDateString('es-VE') + ' ' +
        d.toLocaleTimeString('es-VE', {hour:'2-digit', minute:'2-digit'});
    } else {
      st.textContent = 'Sin tasas';
    }
    compute();
  }

  function loadCache(){
    try{
      var c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if(c){
        AUTO.forEach(function(k){ if(typeof c[k] === 'number') api[k] = c[k]; });
        api.fetchedAt = c.fetchedAt || null;
        api.stale = true;
      }
      var m = JSON.parse(localStorage.getItem(MANUAL_KEY) || 'null');
      if(m) MANUAL.forEach(function(k){ if(m[k]) $(k).value = m[k]; });
    }catch(e){}
  }
  function saveCache(){
    try{
      var o = {fetchedAt:api.fetchedAt};
      AUTO.forEach(function(k){ o[k] = api[k]; });
      localStorage.setItem(CACHE_KEY, JSON.stringify(o));
    }catch(e){}
  }
  function saveManual(){
    try{
      var o = {};
      MANUAL.forEach(function(k){ o[k] = $(k).value; });
      localStorage.setItem(MANUAL_KEY, JSON.stringify(o));
    }catch(e){}
  }

  function pickSource(list, fuente){
    if(!list || !list.length) return null;
    for(var i = 0; i < list.length; i++){
      if(list[i] && list[i].fuente === fuente){
        var v = list[i].promedio;
        if(!ok(v)) v = list[i].venta;
        if(ok(v) && v > 0) return v;
      }
    }
    return null;
  }
  function pickBook(data, name){
    if(!data || !data[name]) return null;
    var b = data[name];
    var ask = ok(b.totalAsk) ? b.totalAsk : b.ask;
    var bid = ok(b.totalBid) ? b.totalBid : b.bid;
    if(ok(ask) && ok(bid) && ask > 0 && bid > 0) return (ask + bid) / 2;
    if(ok(ask) && ask > 0) return ask;
    return null;
  }
  function getJSON(url){
    return fetch(url, {cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error(r.status);
      return r.json();
    }).catch(function(){ return null; });
  }
  function fetchRates(){
    var btn = $('btnRefresh');
    btn.classList.add('spin');
    AUTO.forEach(function(k){ $(k).value = ''; });   // las de a mano NO se borran
    $('prom').value = '';
    return Promise.all([getJSON(API_USD), getJSON(API_EUR), getJSON(API_P2P)]).then(function(res){
      var got = 0;
      var v = {
        bcv: pickSource(res[0], 'oficial'),
        par: pickSource(res[0], 'paralelo'),
        eur: pickSource(res[1], 'oficial'),
        bin: pickBook(res[2], 'binancep2p'),
        byb: pickBook(res[2], 'bybitp2p')
      };
      AUTO.forEach(function(k){ if(ok(v[k])){ api[k] = v[k]; got++; } });
      if(got){ api.fetchedAt = Date.now(); api.stale = false; saveCache(); }
      else { toast('No se pudieron bajar las tasas'); }
      paint();
    }).then(function(){ btn.classList.remove('spin'); });
  }

  /* ---------- comparador ---------- */
  function rows(defs){
    return defs.map(function(d){
      return '<div class="row k-' + d.k + (d.wide ? ' wide' : '') + '"><span>' + d.name + '</span><b>' + d.value + '</b></div>';
    }).join('');
  }

  function compute(){
    var R = {};
    KEYS.forEach(function(k){ R[k] = rate(k); });
    var list = num($('price').value);
    var desc = num($('disc').value);
    if(!ok(desc) || desc < 0) desc = 0;
    if(desc > 99.9) desc = 99.9;
    var net = ok(list) ? list * (1 - desc / 100) : NaN;
    var pay = num($('pay').value);
    var cur = curr();
    /* el campo derecho SIEMPRE es el precio pagando en bolívares;
       si lo estás viendo en $, se pasa a Bs con el BCV, que es como lo cotizan */
    var payBs = ok(pay) ? (cur === 'Bs' ? pay : (ok(R.bcv) ? pay * R.bcv : NaN)) : NaN;

    var hp = $('hintPrice');
    if(ok(net) && net > 0){
      var head = desc > 0
        ? '<div class="row net wide"><span>NETO</span><b>$ ' + fmt(net) + ' (−' + fmt(desc, 1) + '%)</b></div>'
        : '';
      hp.innerHTML = head + rows(KEYS.map(function(k){
        return {k:k, name:SHORT[k], value:(ok(R[k]) && R[k] > 0) ? fmtS(net * R[k]) : '—'};
      }));
    } else {
      hp.innerHTML = '<div class="empty">Ingresa el precio…</div>';
    }

    var hq = $('hintPay');
    if(ok(payBs) && payBs > 0){
      hq.innerHTML = rows(KEYS.map(function(k){
        return {k:k, name:SHORT[k], value:(ok(R[k]) && R[k] > 0) ? '$' + fmt(payBs / R[k]) : '—'};
      }));
    } else if(ok(pay) && pay > 0){
      hq.innerHTML = '<div class="empty">Falta la tasa BCV…</div>';
    } else {
      hq.innerHTML = '<div class="empty">Ingresa el monto…</div>';
    }

    var box = $('verdict');
    var dimmed = box.classList.contains('dim');
    box.className = 'verdict blk' + (dimmed ? ' dim' : '');
    var extra = $('impExtra');
    var adv = $('advice');
    var usable = ok(net) && net > 0 && ok(payBs) && payBs > 0 && ok(R.bcv) && R.bcv > 0;

    if(!usable){
      $('impRate').innerHTML = '--,--<small> Bs/$</small>';
      $('impTag').textContent = 'Esperando';
      extra.innerHTML = '';
      adv.className = 'advice';
      box.dataset.imp = '';
      box.dataset.tag = '';
      box.dataset.advice = '';
      return;
    }

    var imp = payBs / net;
    $('impRate').innerHTML = fmt(imp) + '<small> Bs/$</small>';

    var match = null, best = 0.01;
    KEYS.forEach(function(k){
      if(!ok(R[k]) || R[k] <= 0) return;
      var dd = Math.abs(imp / R[k] - 1);
      if(dd <= best){ best = dd; match = k; }
    });

    var tone = 'mid', tag = 'Tasa mixta / inflada';
    if(match === 'bcv'){ tone = 'ok'; tag = 'Te cobran a tasa BCV'; }
    else if(match === 'eur'){ tone = 'eur'; tag = '🚩 Te cobran a tasa EURO'; }
    else if(match === 'par'){ tone = 'bad'; tag = 'Te cobran a paralelo'; }
    else if(match === 'bin'){ tone = 'mid'; tag = 'Te cobran a tasa Binance'; }
    else if(match === 'byb'){ tone = 'mid'; tag = 'Te cobran a tasa Bybit'; }
    else if(match === 'zel'){ tone = 'mid'; tag = 'Te cobran a tasa Zelle'; }
    else if(match === 'ppl'){ tone = 'mid'; tag = 'Te cobran a tasa PayPal'; }
    else if(imp <= R.bcv * 1.005){ tone = 'ok'; tag = 'Mejor que el BCV'; }
    else {
      var top = 0;
      MARKET.concat(['eur']).forEach(function(k){ if(ok(R[k]) && R[k] > top) top = R[k]; });
      if(top > 0 && imp > top * 1.01){ tone = 'bad'; tag = 'Por encima de todas'; }
    }
    box.classList.add(tone);
    $('impTag').textContent = tag;

    var over = (imp / R.bcv - 1) * 100;
    var line = '<span class="' + (over > 0.05 ? 'up' : 'down') + '">' + pct(over) + '</span> sobre el BCV';
    if(desc > 0){
      var real = (1 - payBs / (list * R.bcv)) * 100;
      line += ' · dicen −' + fmt(desc, 1) + '%';
      if(real >= 0.05) line += ' y el real es <b class="down">−' + fmt(real, 1) + ' %</b>';
      else if(real <= -0.05) line += ' pero pagas <b class="up">' + fmt(-real, 1) + ' % de más</b>';
      else line += ' y el real es <b>0 %</b>';
    }
    if(match === 'eur'){
      line += '<br>El euro no es tasa de pago: son ' + pct(over) + ' de más disfrazados de “oficial”.';
    }
    extra.innerHTML = line;

    /* ---- cómo te conviene pagar ----
       Comparamos los dos precios que te dan. Para poder compararlos hay que saber
       cuánto vale tu dólar: la mejor tasa de mercado a la que puedes venderlo. */
    var refV = 0, refK = null;
    MARKET.forEach(function(k){ if(ok(R[k]) && R[k] > refV){ refV = R[k]; refK = k; } });
    if(refK){
      var payBsInUsd = payBs / refV;          // lo que te cuesta, en dólares, pagando en Bs
      var diff = net - payBsInUsd;            // + = pagar en Bs sale más barato
      var rel = diff / net;
      var cls, big, save, why;
      if(rel > 0.005){
        cls = 'bs'; big = 'Te conviene pagar en Bs';
        save = 'ahorras $ ' + fmtU(diff, '$');
        why = 'Bs ' + fmtS(payBs) + ' son $ ' + fmtU(payBsInUsd, '$') +
              ' vendiendo a ' + LABEL[refK] + ' (' + fmt(refV) + '), y en efectivo te piden $ ' + fmtU(net, '$') + '.';
      } else if(rel < -0.005){
        cls = 'usd'; big = 'Te conviene pagar en $';
        save = 'ahorras $ ' + fmtU(-diff, '$');
        why = 'Pagar esos Bs ' + fmtS(payBs) + ' te cuesta $ ' + fmtU(payBsInUsd, '$') +
              ' a ' + LABEL[refK] + ' (' + fmt(refV) + '), y en efectivo te piden $ ' + fmtU(net, '$') + '.';
      } else {
        cls = 'tie'; big = 'Da igual como pagues';
        save = '';
        why = 'Los dos precios salen casi iguales midiendo tu dólar a ' + LABEL[refK] + ' (' + fmt(refV) + ').';
      }
      adv.className = 'advice on ' + cls;
      $('adviceBig').textContent = big;
      $('adviceSave').textContent = save;
      $('adviceWhy').textContent = why;
      box.dataset.advice = big + (save ? ' · ' + save : '');
      box.dataset.adviceWhy = why;
    } else {
      adv.className = 'advice';
      box.dataset.advice = '';
      box.dataset.adviceWhy = '';
    }

    box.dataset.imp = imp;
    box.dataset.tag = tag;
    box.dataset.paybs = payBs;
    box.dataset.net = net;
  }

  /* ---------- teclado ---------- */
  function showResult(){
    var el = target();
    var box = $('res');
    var raw = (el.value || '').trim();
    if(!raw){ box.className = 'res'; box.textContent = '0'; box.dataset.value = ''; return; }
    try{
      var v = evaluate(raw);
      if(!ok(v)) throw new Error('∞');
      box.className = 'res';
      var d = (Math.abs(v % 1) > 1e-9) ? 2 : 0;
      if(el.id === 'expr') box.innerHTML = '<u>' + calcCur() + '</u>' + fmtU(v, calcCur(), d);
      else box.textContent = fmt(v, d);
      box.dataset.value = v;
    }catch(e){
      box.className = 'res err';
      box.textContent = '…';
      box.dataset.value = '';
    }
  }
  function afterEdit(){
    MANUAL.forEach(function(k){ if(active && active.id === k) saveManual(); });
    paint();
    showResult();
  }

  function insert(text){
    var el = target();
    if(el !== active) setActive(el);
    var start = (el.selectionStart === null) ? el.value.length : el.selectionStart;
    var end = (el.selectionEnd === null) ? el.value.length : el.selectionEnd;
    el.value = el.value.slice(0, start) + text + el.value.slice(end);
    var pos = start + text.length;
    try{ el.setSelectionRange(pos, pos); }catch(e){}
    afterEdit();
  }
  function backspace(){
    var el = target();
    if(el !== active) setActive(el);
    var start = el.selectionStart, end = el.selectionEnd;
    if(start === end){
      if(start === 0) return;
      el.value = el.value.slice(0, start - 1) + el.value.slice(end);
      try{ el.setSelectionRange(start - 1, start - 1); }catch(e){}
    } else {
      el.value = el.value.slice(0, start) + el.value.slice(end);
      try{ el.setSelectionRange(start, start); }catch(e){}
    }
    afterEdit();
  }
  function clearField(){
    var el = target();
    if(el !== active) setActive(el);
    el.value = '';
    try{ el.setSelectionRange(0, 0); }catch(e){}
    afterEdit();
  }
  function equals(){
    var el = target();
    var v = num(el.value);
    if(!ok(v)) return;
    el.value = plain(v, decFor(el));
    try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){}
    afterEdit();
  }

  function toast(msg){
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ t.classList.remove('show'); }, 1900);
  }

  function press(el, fn){
    if(window.PointerEvent){
      el.addEventListener('pointerdown', function(e){
        if(e.button && e.button !== 0) return;
        if(e.cancelable) e.preventDefault();
        fn();
      });
    } else {
      el.addEventListener('mousedown', function(e){ e.preventDefault(); });
      el.addEventListener('click', fn);
    }
    el.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fn(); }
    });
  }

  /* ---------- eventos ---------- */
  build();

  FIELDS.forEach(function(id){
    var el = $(id);
    el.addEventListener('focus', function(){ setActive(el); });
    el.addEventListener('click', function(){ setActive(el); });
    el.addEventListener('input', afterEdit);
    el.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); equals(); }
    });
  });

  document.addEventListener('pointerdown', function(e){
    var t = e.target;
    if(t.closest && (t.closest('#pad') || t.closest('#cur'))) return;
    var card = t.closest && t.closest('.rate');
    if(card){
      var inp = card.querySelector('input');
      if(t !== inp){ e.preventDefault(); inp.focus(); setActive(inp); }
      return;
    }
    if(t.tagName === 'INPUT') return;
    if(active){ active.blur(); setActive(null); }
  }, true);

  /* el botón del campo derecho NO cambia el precio: lo muestra en la otra moneda */
  press($('cur'), function(){
    var from = curr(), to = (from === 'Bs') ? '$' : 'Bs';
    var bcv = rate('bcv');
    var v = num($('pay').value);
    if(ok(v) && v > 0){
      if(!ok(bcv) || bcv <= 0){ toast('Sin tasa BCV no puedo mostrarlo en la otra moneda'); return; }
      var conv = (to === '$') ? v / bcv : v * bcv;
      $('pay').value = plain(Math.round(conv * 100) / 100, (to === '$') ? '.' : ',');
    }
    $('cur').dataset.cur = to;
    $('curTxt').textContent = to;
    setActive(active);
    afterEdit();
  });

  function setCalcCur(u){
    $('calcCur').dataset.cur = u;
    $('calcCurTxt').textContent = u;
    $('toPay').textContent = '↑ A pagando en ' + u;
  }
  press($('calcCur'), function(){
    setCalcCur(calcCur() === 'Bs' ? '$' : 'Bs');
    setActive(active);
  });

  document.querySelectorAll('.chip').forEach(function(b){
    press(b, function(){
      var k = b.dataset.rate, v = rate(k);
      if(!ok(v)){ toast('Sin tasa de ' + LABEL[k]); return; }
      var el = target();
      if(el.id !== 'expr') return;
      var caret = (el.selectionStart === null) ? el.value.length : el.selectionStart;
      var before = el.value.slice(0, caret);
      if(/[0-9.,)]\s*$/.test(before)){
        var toBs = (calcCur() === '$');
        insert((toBs ? '*' : '/') + plain(v, decFor(el)));
        setCalcCur(toBs ? 'Bs' : '$');
        setActive(el);
      } else {
        insert(plain(v, decFor(el)));
      }
    });
  });
  document.querySelectorAll('.key[data-ins]').forEach(function(b){
    press(b, function(){ insert(b.dataset.ins); });
  });
  press($('kDel'), backspace);
  press($('kClear'), clearField);
  press($('kEq'), equals);

  press($('toPrice'), function(){
    var v = num($('expr').value);
    if(!ok(v)){ toast('Nada que enviar'); return; }
    if(calcCur() === '$'){
      $('price').value = plain(v, '.');
      afterEdit();
      toast('Precio: $ ' + fmtU(v, '$'));
    } else {
      if(curr() !== 'Bs'){ $('cur').dataset.cur = 'Bs'; $('curTxt').textContent = 'Bs'; }
      $('pay').value = plain(v, ',');
      afterEdit();
      toast('Eso es Bs: va al precio pagando en Bs');
    }
  });
  press($('toPay'), function(){
    var v = num($('expr').value);
    if(!ok(v)){ toast('Nada que enviar'); return; }
    $('cur').dataset.cur = calcCur();
    $('curTxt').textContent = calcCur();
    $('pay').value = plain(v, decFor($('pay')));
    afterEdit();
    toast('Pagando en Bs, visto en ' + curr() + ': ' + fmtU(v, curr()));
  });

  $('btnRefresh').addEventListener('click', fetchRates);
  $('btnCopy').addEventListener('click', function(){
    var L = [];
    L.push('Calculadolar · ' + new Date().toLocaleString('es-VE'));
    KEYS.forEach(function(k){
      if(ok(rate(k))) L.push(LABEL[k] + ': ' + fmt(rate(k)) + ' Bs/$' + (isManual(k) ? ' (a mano)' : ''));
    });
    var list = num($('price').value), desc = num($('disc').value);
    var payBs = parseFloat($('verdict').dataset.paybs);
    if(ok(list) && list > 0){
      L.push('Precio pagando en $: ' + fmt(list) + (ok(desc) && desc > 0 ? ' con −' + fmt(desc,1) + '% = ' + fmt(list * (1 - desc/100)) : ''));
    }
    if(ok(payBs) && payBs > 0) L.push('Precio pagando en Bs: ' + fmt(payBs));
    var imp = parseFloat($('verdict').dataset.imp);
    if(ok(imp)){
      L.push('Tasa implícita: ' + fmt(imp) + ' Bs/$ — ' + $('verdict').dataset.tag);
      L.push($('impExtra').innerText.replace(/\s+/g, ' ').trim());
      if($('verdict').dataset.advice){
        L.push('→ ' + $('verdict').dataset.advice);
        L.push($('verdict').dataset.adviceWhy);
      }
    }
    var ex = $('expr').value.trim(), exv = num(ex);
    if(ex && ok(exv)) L.push('Cálculo: ' + ex + ' = ' + calcCur() + ' ' + fmtU(exv, calcCur()));
    var text = L.join('\n');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast('Copiado'); }, function(){ toast('No se pudo copiar'); });
    } else {
      toast('No se pudo copiar');
    }
  });

  /* ---------- recibo en imagen ---------- */
  var COL = {bcv:'#ff453a', par:'#30d158', bin:'#ffd60a', byb:'#5ac8fa', eur:'#0a84ff',
             zel:'#bf5af2', ppl:'#7d8cff', prom:'#c7c7cc',
             bg:'#0b0b0c', line:'#2e2e32', dim:'#8e8e93', dim2:'#5a5a5f', warn:'#ffd60a'};

  function roundRect(g, x, y, w, h, r){
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  function buildReceipt(){
    var W = 760, PAD = 46;
    var c = document.createElement('canvas');
    c.width = W; c.height = 2200;
    var g = c.getContext('2d');
    g.fillStyle = COL.bg; g.fillRect(0, 0, W, c.height);
    var y = PAD + 42;

    function font(size, weight){
      g.font = (weight || '400') + ' ' + size + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
    }
    function put(t, x, size, weight, color, align){
      font(size, weight); g.fillStyle = color; g.textAlign = align || 'left'; g.textBaseline = 'alphabetic';
      g.fillText(t, x, y);
    }
    function rule(){
      g.strokeStyle = COL.line; g.lineWidth = 1;
      g.beginPath(); g.moveTo(PAD, y + 0.5); g.lineTo(W - PAD, y + 0.5); g.stroke();
    }
    function wrap(t, size, color, lh, weight){
      font(size, weight || '400'); g.fillStyle = color; g.textAlign = 'left';
      var words = String(t).split(' '), ln = '';
      for(var i = 0; i < words.length; i++){
        var test = ln ? ln + ' ' + words[i] : words[i];
        if(g.measureText(test).width > W - PAD * 2 && ln){ g.fillText(ln, PAD, y); y += lh; ln = words[i]; }
        else ln = test;
      }
      if(ln){ g.fillText(ln, PAD, y); y += lh; }
    }
    function pill(t, color){
      font(22, '800');
      var w = g.measureText(t).width + 34, h = 44;
      g.fillStyle = color + '26'; roundRect(g, PAD, y - 31, w, h, 11); g.fill();
      g.strokeStyle = color + '99'; g.lineWidth = 2; roundRect(g, PAD, y - 31, w, h, 11); g.stroke();
      g.fillStyle = color; g.textAlign = 'left'; g.fillText(t, PAD + 17, y);
      y += 30;
    }
    function row(left, right, color, size){
      put(left, PAD, size || 27, '600', COL.dim);
      put(right, W - PAD, size || 27, '700', color || '#fff', 'right');
      y += 36;
    }
    function sub(t){ put(t, PAD + 16, 22, '400', COL.dim2); y += 32; }

    var d = new Date();
    put('Calculadolar', PAD, 42, '800', COL.bcv);
    put(d.toLocaleDateString('es-VE') + '  ' + d.toLocaleTimeString('es-VE', {hour:'2-digit', minute:'2-digit'}),
        W - PAD, 22, '600', COL.dim, 'right');
    y += 26; rule(); y += 44;

    put('TASAS DEL DÍA', PAD, 20, '800', COL.dim); y += 40;
    KEYS.forEach(function(k){
      if(!ok(rate(k))) return;
      row(LABEL[k] + (isManual(k) ? '  (a mano)' : ''), fmt(rate(k)) + ' Bs', COL[k], 26);
    });
    y += 8; rule(); y += 44;

    var R = {};
    KEYS.forEach(function(k){ R[k] = rate(k); });
    var list = num($('price').value), desc = num($('disc').value);
    if(!ok(desc) || desc < 0) desc = 0;
    var net = ok(list) ? list * (1 - desc / 100) : NaN;
    var payBs = parseFloat($('verdict').dataset.paybs);
    if(!ok(payBs)){
      var pv = num($('pay').value);
      payBs = (ok(pv) && curr() === 'Bs') ? pv : (ok(pv) && ok(R.bcv) ? pv * R.bcv : NaN);
    }
    var hasP = ok(net) && net > 0, hasQ = ok(payBs) && payBs > 0;

    if(hasP && hasQ && ok(R.bcv)){
      put('LOS DOS PRECIOS', PAD, 20, '800', COL.dim); y += 40;
      row('Pagando en $', '$ ' + fmt(net) + (desc > 0 ? '   (−' + fmt(desc, 1) + '%)' : ''), '#fff');
      sub('= Bs ' + fmtS(net * R.bcv) + ' a tasa BCV');
      row('Pagando en Bs', 'Bs ' + fmt(payBs), '#fff');
      sub('= $ ' + fmt(payBs / R.bcv) + ' a tasa BCV');
      var listaBs = net * R.bcv, diff = payBs - listaBs;
      y += 4;
      row(Math.abs(diff) < 0.01 ? 'Sale igual' : (diff > 0 ? 'Pagas de más' : 'Pagas de menos'),
          'Bs ' + fmtS(Math.abs(diff)) + '   ' + pct(diff / listaBs * 100),
          diff > 0.01 ? COL.bcv : COL.par);
      y += 8; rule(); y += 44;
    } else if(hasP){
      put('EL PRECIO', PAD, 20, '800', COL.dim); y += 40;
      row('Pagando en $', '$ ' + fmt(net) + (desc > 0 ? '   (−' + fmt(desc, 1) + '%)' : ''), '#fff');
      y += 4;
      KEYS.forEach(function(k){
        if(!ok(R[k]) || R[k] <= 0) return;
        row('a ' + LABEL[k], 'Bs ' + fmtS(net * R[k]), COL[k], 25);
      });
      y += 8; rule(); y += 44;
    } else if(hasQ){
      put('EL MONTO', PAD, 20, '800', COL.dim); y += 40;
      row('Pagando en Bs', 'Bs ' + fmt(payBs), '#fff');
      y += 4;
      KEYS.forEach(function(k){
        if(!ok(R[k]) || R[k] <= 0) return;
        row('a ' + LABEL[k], '$ ' + fmt(payBs / R[k]), COL[k], 25);
      });
      y += 8; rule(); y += 44;
    }

    var imp = parseFloat($('verdict').dataset.imp);
    if(ok(imp)){
      var tone = $('verdict').classList.contains('ok') ? COL.par
               : $('verdict').classList.contains('eur') ? COL.eur
               : $('verdict').classList.contains('bad') ? COL.bcv : COL.warn;
      put('TASA IMPLÍCITA', PAD, 20, '800', COL.dim); y += 58;
      put(fmt(imp), PAD, 56, '800', '#fff');
      font(56, '800');
      put(' Bs/$', PAD + g.measureText(fmt(imp)).width, 24, '600', COL.dim);
      y += 52;
      pill($('verdict').dataset.tag || '', tone);
      y += 22;
      $('impExtra').innerText.split('\n').forEach(function(t){
        t = t.replace(/\s+/g, ' ').trim();
        if(t) wrap(t, 23, COL.dim, 32);
      });
      if($('verdict').dataset.advice){
        y += 18;
        var advTone = $('advice').classList.contains('bs') ? COL.par
                    : $('advice').classList.contains('usd') ? COL.warn : COL.dim;
        wrap($('verdict').dataset.advice, 30, advTone, 40, '800');
        y += 4;
        wrap($('verdict').dataset.adviceWhy, 21, COL.dim2, 30);
      }
      y += 12; rule(); y += 34;
    }

    var ex = $('expr').value.trim(), exv = num(ex);
    if(ex && ok(exv) && /[+\-*/]/.test(ex)){
      put('EL CÁLCULO', PAD, 20, '800', COL.dim); y += 38;
      wrap(ex.replace(/\*/g, ' × ').replace(/\//g, ' ÷ ') + '  =  ' + calcCur() + ' ' + fmtU(exv, calcCur()), 26, '#fff', 36);
      y += 10; rule(); y += 34;
    }

    put('cimadevgroup.github.io/calculadolar', PAD, 19, '600', COL.dim2);
    y += 10;

    var out = document.createElement('canvas');
    out.width = W; out.height = Math.round(y + PAD - 10);
    var og = out.getContext('2d');
    og.fillStyle = COL.bg; og.fillRect(0, 0, out.width, out.height);
    og.drawImage(c, 0, 0);
    return out;
  }

  function shareReceipt(){
    var canvas, dataUrl;
    try{
      canvas = buildReceipt();
      dataUrl = canvas.toDataURL('image/png');
    }catch(e){ toast('No se pudo armar el recibo'); return; }

    var bin = atob(dataUrl.split(',')[1]);
    var arr = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    var blob = new Blob([arr], {type:'image/png'});
    var d = new Date();
    var name = 'calculadolar-' + d.toISOString().slice(0, 16).replace(/[-:T]/g, '') + '.png';

    var file = null;
    try{ file = new File([blob], name, {type:'image/png'}); }catch(e){}

    if(file && navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){
      navigator.share({files:[file]}).catch(function(err){
        if(err && err.name === 'AbortError') return;
        download(blob, name);
      });
      return;
    }
    download(blob, name);
  }
  function download(blob, name){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
    toast('Recibo guardado');
  }
  $('btnShot').addEventListener('click', shareReceipt);

  /* ---------- fuera los gestos del navegador ---------- */
  ['gesturestart','gesturechange','gestureend'].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); }, {passive:false});
  });
  document.addEventListener('dblclick', function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener('contextmenu', function(e){
    if(e.target && e.target.tagName === 'INPUT') return;
    e.preventDefault();
  });
  document.addEventListener('selectstart', function(e){
    if(e.target && e.target.tagName === 'INPUT') return;
    e.preventDefault();
  });
  document.addEventListener('touchmove', function(e){
    if(e.touches && e.touches.length > 1) e.preventDefault();
  }, {passive:false});

  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if(standalone && window.history && history.pushState){
    var lastBack = 0;
    history.pushState({cd:1}, '');
    window.addEventListener('popstate', function(){
      var now = Date.now();
      if(now - lastBack < 2500) return;
      lastBack = now;
      history.pushState({cd:1}, '');
      toast('Toca atrás otra vez para salir');
    });
  }

  /* ---------- arranque ---------- */
  loadCache();
  try{ paint(); }catch(e){ console.error(e); }
  setActive(null);
  fetchRates();

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
